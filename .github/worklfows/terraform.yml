name: "Terraform CI/CD"

on:
  push:
    branches: ["main"]

  permissions:
    id-token: write # Required for requesting the JWT for OIDC
    content: read

  jobs:
    terraform:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        # --- ISSUE 1: MisConfigured AWS OIDC Role ---
        - name: Configure AWS Credentials via OIDC
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: arn:arn:iam::123456789012:role/GitHubActionsTerraformRole
            aws-region: us-east-1

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3

        - name: Terraform Init
          run: terraform init

        # --- ISSUE 2: Secret Masking & Missing .TFVARS ---
        - name: Terraform Apply
          run: terraform apply -auto-approve
          env:
            # Fails if TF_VAR_ is not prefixed or if secret isn't passed
            TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}